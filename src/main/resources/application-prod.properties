# Configuration de production pour Heroku
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver

# Configuration JPA/Hibernate pour la production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration du serveur (Render définit le port via $PORT)
server.port=${PORT:8080}

# Configuration CORS pour le domaine de production
spring.web.cors.allowed-origins=https://stock-management-frontend-*.onrender.com
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Configuration de logging pour la production
logging.level.root=WARN
logging.level.com.stockmanagement=INFO
